# Builds the Vite client and deploys static assets to GitHub Pages (not the repo README).
# Repo Settings → Pages → Build and deployment → Source: GitHub Actions.
# Optional repo Variable VITE_API_URL: API origin (no trailing slash). If unset, build uses https://devops-ecom.onrender.com
# On the API host set ADDITIONAL_CORS_ORIGINS=https://<your-username>.github.io so the browser can call the API from Pages.

name: Deploy client to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "client/**"
      - ".github/workflows/github-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install and build client
        working-directory: client
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: |
          npm ci
          if [ -z "${VITE_API_URL:-}" ]; then
            export VITE_API_URL="https://devops-ecom.onrender.com"
          fi
          npm run build -- --base=/${{ github.event.repository.name }}/

      - name: SPA fallback (GitHub Pages serves 404.html for unknown paths)
        run: cp client/dist/index.html client/dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
